apiVersion: 1.2
image:
  imageType: raw
  arch: aarch64
  baseImage: SL-Micro.aarch64-6.1-Default-GM.raw
  outputImageName: arm-k3s-cluster.raw
operatingSystem:
  rawConfiguration:
    diskSize: 30G
  time:
    timezone: Europe/Paris
    ntp:
      forceWait: true
      pools:
        - 2.suse.pool.ntp.org
  systemd:
    enable:
      - cockpit.socket
  keymap: us
  users:
  - username: root
    encryptedPassword: ${ROOT_PASSWORD}
    createHomeDir: true

  - username: suse-user
    encryptedPassword: ${USER_PASSWORD}
    createHomeDir: true

  packages:
    packageList:
    - jq
    - container-selinux
    - k3s-selinux
    - git
    sccRegistrationCode: ${SCC_REGISTRATION_CODE}

kubernetes:
  version: v1.32.2+k3s1
  helm:
    charts:
      - name: cert-manager
        repositoryName: jetstack
        version: 1.15.3
        targetNamespace: cert-manager
        valuesFile: certmanager.yaml
        createNamespace: true
        installationNamespace: kube-system
    repositories:
      - name: jetstack
        url: https://charts.jetstack.io
