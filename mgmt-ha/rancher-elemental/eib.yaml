apiVersion: 1.1
image:
  imageType: raw
  arch: aarch64
  baseImage: SL-Micro.aarch64-6.0-Default-GM2.raw
  outputImageName: rke2-cluster-image.raw
operatingSystem:
  rawConfiguration:
    diskSize: 30G
  packages:
    packageList:
      - jq
      - qemu-guest-agent
    sccRegistrationCode: xxx
  systemd:
    disable:
      - rebootmgr.service
      - transactional-update.timer
      - transactional-update-cleanup.timer
    enable:
      - qemu-guest-agent
  users:
    - username: root
      createHomeDir: true
      encryptedPassword: xxx
      sshKeys:
        - ssh-rsa xxx
kubernetes:
  network:
    apiVIP: 192.168.205.100
    apiHost: 192-168-205-100.sslip.io
  nodes:
    - hostname: vm1
      initializer: true
      type: server
    - hostname: vm2
      type: server
    - hostname: vm3
      type: server
  helm:
    charts:
      - createNamespace: true
        installationNamespace: kube-system
        name: rancher
        repositoryName: rancher-prime
        targetNamespace: cattle-system
        valuesFile: rancher.yaml
        version: 2.10.3
      - createNamespace: true
        installationNamespace: kube-system
        name: cert-manager
        repositoryName: jetstack
        targetNamespace: cert-manager
        valuesFile: certmanager.yaml
        version: 1.14.2
      - name: elemental-operator-crds-chart
        createNamespace: true
        installationNamespace: kube-system
        repositoryName: rancher-oci
        targetNamespace: cattle-elemental-system
        version: 1.6.5
      - name: elemental-operator-chart
        createNamespace: true
        installationNamespace: kube-system
        repositoryName: rancher-oci
        targetNamespace: cattle-elemental-system
        version: 1.6.5
      - name: elemental
        createNamespace: true
        installationNamespace: kube-system
        repositoryName: elementalui
        targetNamespace: cattle-ui-plugin-system
        version: 3.0.0
    repositories:
      - name: rancher-prime
        plainHTTP: false
        skipTLSVerify: true
        url: https://charts.rancher.com/server-charts/prime
      - name: jetstack
        plainHTTP: false
        skipTLSVerify: true
        url: https://charts.jetstack.io
      - name: rancher-oci
        url: oci://registry.suse.com/rancher
      - name: elementalui
        url: https://github.com/rancher/ui-plugin-charts/raw/main
  version: v1.31.6+rke2r1
